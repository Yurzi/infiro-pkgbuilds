maintainers:
  - github: Yurzi

build_prefix: extra-x86_64

pre_build_script: |
  update_pkgver_and_pkgrel(_G.newver)

post_build_script: |
  git_pkgbuild_commit()

update_on:
  - source: regex
    url: "https://nya.globalslb.net/natfrp/client/frpc/"
    regex: '([0-9]+\.[0-9]+\.[0-9]+-sakura-[0-9.]+)/'
    from_pattern: '-'
    to_pattern: '_'
