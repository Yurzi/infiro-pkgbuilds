maintainers:
  - github: Yurzi

build_prefix: extra-x86_64

pre_build_script: |
  import re, urllib.request

  with urllib.request.urlopen('https://antigravity.google/download', timeout=30) as r:
      html = r.read().decode('utf-8', errors='replace')

  matches = dict(re.findall(
      r'antigravity-hub/(\d+(?:\.\d+)+)-(\d+)/linux-x64/Antigravity\.tar\.gz',
      html,
  ))
  if _G.newver not in matches:
      raise ValueError(f'Could not find build ID for version {_G.newver}')
  build = matches[_G.newver]

  with open('PKGBUILD') as f:
      content = f.read()
  content = re.sub(r'^_build=.*$', f'_build={build}', content, flags=re.M)
  with open('PKGBUILD', 'w') as f:
      f.write(content)

  update_pkgver_and_pkgrel(_G.newver)

post_build_script: |
  git_pkgbuild_commit()

update_on:
  - source: regex
    url: https://antigravity.google/download
    regex: 'antigravity-hub/(\d+(?:\.\d+)+)-\d+/linux-x64/Antigravity\.tar\.gz'
