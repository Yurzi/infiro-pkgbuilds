maintainers:
  - github: Yurzi

build_prefix: extra-x86_64

pre_build_script: |
  pkgver, build = _G.newver.split('-', 1)

  updated = False
  for line in edit_file('PKGBUILD'):
      if line.startswith('_build='):
          line = f'_build={build}'
          updated = True
      print(line)
  if not updated:
      raise ValueError('Could not find _build= in PKGBUILD')

  update_pkgver_and_pkgrel(pkgver)

post_build_script: |
  git_pkgbuild_commit()

update_on:
  - source: regex
    url: https://antigravity.google/download
    regex: 'antigravity-hub/(\d+(?:\.\d+)+-\d+)/linux-x64/Antigravity\.tar\.gz'
