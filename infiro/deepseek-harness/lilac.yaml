maintainers:
  - github: Yurzi

build_prefix: extra-x86_64

pre_build_script: |
  import json
  import re
  import urllib.request

  tag = f'dsh-v{_G.newver}'
  with urllib.request.urlopen(
      f'https://api.github.com/repos/deepseek-ai/deepseek-harness/commits/{tag}'
  ) as response:
      commit = json.load(response)['sha']

  with open('PKGBUILD') as f:
      content = f.read()
  content = re.sub(r'^_commit=.*$', f'_commit={commit}', content, flags=re.M)
  content = re.sub(
      r'^_upstream_ver=.*$', f'_upstream_ver={_G.newver}', content, flags=re.M
  )
  with open('PKGBUILD', 'w') as f:
      f.write(content)

  newver = _G.newver.replace('-', '')
  update_pkgver_and_pkgrel(newver)

post_build_script: |
  git_pkgbuild_commit()

update_on:
  - source: github
    github: deepseek-ai/deepseek-harness
    query: dsh-v
    prefix: dsh-v
    use_latest_tag: true
    include_regex: '^dsh-v[0-9]+(?:\.[0-9]+)*-rc\.[0-9]+$'
